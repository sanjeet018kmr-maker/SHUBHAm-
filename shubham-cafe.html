<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17110d">
<title>Welcome to Shubham Cafe</title>
<style>
  :root{--bg:#17110d;--panel:#221a14;--line:#3a2d23;--text:#f5ece1;--muted:#b8a794;--gold:#c9a46a;--green:#2fa866}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#2a1f17 0%,var(--bg) 60%);color:var(--text);
       font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center}
  .wrap{width:100%;max-width:420px;padding:36px 20px 28px;text-align:center}
  .mark{width:64px;height:64px;margin:0 auto 18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
  .mark svg{width:30px;height:30px}
  .welcome{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--muted);margin:0 0 10px}
  h1{font-size:36px;line-height:1.1;margin:0 0 8px;font-weight:600}
  .rule{width:48px;height:2px;background:var(--gold);margin:16px auto 26px;border:0}
  .sub{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--muted);font-size:15px;margin:0 0 26px}
  a.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);
        background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:12px;
        font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:transform .12s,border-color .12s}
  a.btn:active{transform:scale(.98)}
  a.btn:hover{border-color:var(--gold)}
  .ico{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center}
  .ico svg{width:22px;height:22px}
  .t{font-size:16px;font-weight:600}
  .d{font-size:13px;color:var(--muted);margin-top:2px}
  .arrow{margin-left:auto;color:var(--muted);font-size:20px}
  .gold .ico{background:var(--gold);color:#1b140e}
  .green .ico{background:var(--green);color:#fff}
  .insta .ico{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);color:#fff}
  .num{display:inline-block;margin-top:22px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;color:var(--muted);text-decoration:none}
  .num b{color:var(--text);font-weight:600}
  .foot{margin-top:22px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;color:#7d6e5f}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* ============ EDIT ONLY THIS PART ============ */
const CAFE = {
  name: "Shubham Cafe",
  tagline: "Fresh coffee. Warm moments. Thank you for visiting.",
  // Google review: paste the Place ID OR the full review link. Leave both empty to hide the button.
  placeId: "",
  reviewUrl: "",
  whatsapp: "917004722024",                       // country code + number, no + or spaces
  whatsappShow: "+91 70047 22024",
  orderMessage: "Hi Shubham Cafe! I would like to place an order.",
  instagram: "https://www.instagram.com/yours._shubham_"
};
/* ============================================= */

const ICON = {
  cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>'
};

const review = CAFE.reviewUrl || (CAFE.placeId ? "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(CAFE.placeId) : "");
const order = "https://wa.me/" + CAFE.whatsapp + "?text=" + encodeURIComponent(CAFE.orderMessage);
document.title = "Welcome to " + CAFE.name;

const app = document.getElementById("app");
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function txt(tag, cls, t){ const e = el(tag, cls); e.textContent = t; return e; }

const mark = el("div","mark",ICON.cup);
app.append(mark, txt("p","welcome","Welcome to"), txt("h1","",CAFE.name), el("hr","rule"), txt("p","sub",CAFE.tagline));

function button(cls, icon, title, desc, href){
  const a = el("a","btn " + cls);
  a.href = href;
  a.append(el("span","ico",icon));
  const box = el("span");
  box.append(txt("div","t",title), txt("div","d",desc));
  a.append(box, txt("span","arrow","\u203A"));
  return a;
}
if(review) app.append(button("gold", ICON.star, "Rate us on Google", "Share your experience in 20 seconds", review));
app.append(button("green", ICON.chat, "Order on WhatsApp", "Chat with us to place your order", order));
app.append(button("insta", ICON.cam, "Follow on Instagram", "See our latest updates", CAFE.instagram));

const n = el("a","num","Call or WhatsApp: <b></b>");
n.href = order; n.querySelector("b").textContent = CAFE.whatsappShow;
app.append(n);
</script>
</body>
</html>
